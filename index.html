<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ระบบควบคุมงานโครงการ หมวดทางหลวงเชิงเนิน</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap');

/* โทนสีระบบควบคุมงานโครงการ: เขียวมรกต (ระบบอุบัติเหตุใช้น้ำเงิน-ส้ม) */
:root{
  --ink:#14241f; --ink-2:#03201a; --ink-soft:#4a5c56; --ink-mute:#84958f;
  --paper:#f3f6f4; --paper-2:#e8eeea; --card:#FFFFFF; --line:#d9e2dd;
  --brand-900:#073d33; --brand-800:#0c5a4b; --brand-700:#12705f;
  --acc:#0b8f63; --acc-500:#1fb383; --acc-deep:#0a6f4d; --acc-glow:#e1f5ec;
  --ok:#2f7d4f; --ok-bg:#e6f3ea;
  --warn:#9a6a08; --warn-bg:#fdf3dc;
  --bad:#c1402f; --bad-bg:#fbeae7;
  --info:#1f64a3; --info-bg:#e6effa;
  --shadow:0 1px 2px rgba(7,61,51,.05),0 10px 22px -16px rgba(7,61,51,.18);
  --shadow-lg:0 16px 40px -14px rgba(3,32,26,.38);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.display{font-family:'Kanit',sans-serif;font-weight:700}
.mono,.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:var(--acc-deep)}
.shell{max-width:1240px;margin:0 auto;padding:0 18px 70px}

/* ---------- ส่วนหัว ---------- */
.app-header{background:radial-gradient(1100px 420px at 12% -20%, var(--brand-800) 0%, var(--ink-2) 58%);color:var(--paper);padding:18px 22px 0;border-bottom:1px solid rgba(0,0,0,.35)}
.app-header .top-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;max-width:1240px;margin:0 auto}
.app-header h1{font-size:21px;margin:0 0 2px;color:#fff;letter-spacing:-.01em}
.dept-logo{width:60px;height:60px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.app-header .sub{font-size:13px;color:#9fb3ac;margin:0}
.app-header .who{font-size:12.5px;color:#8fa59d;margin:0;text-align:right}
.demo-badge{display:inline-block;background:#f7c948;color:#3d2e00;font-family:'Kanit',sans-serif;font-weight:600;font-size:11.5px;border-radius:99px;padding:1px 10px;margin-left:6px;vertical-align:2px}
.project-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:1240px;margin:12px auto 0}
.project-bar select{font-family:'Kanit',sans-serif;font-weight:500;font-size:14px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:6px 10px;max-width:min(720px,100%)}
.project-bar select option{color:var(--ink)}
.status-pill{font-size:12px;border-radius:99px;padding:2px 10px;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:0;max-width:1240px;margin:12px auto 0;overflow-x:auto;border-top:1px solid rgba(255,255,255,.08);scrollbar-width:thin}
.tab-btn{font-family:'Kanit',sans-serif;font-weight:600;font-size:13px;background:transparent;border:none;color:#8aa39a;padding:10px 13px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color .15s}
.tab-btn:hover{color:#e2ebe7}
.tab-btn.active{color:#fff;border-bottom-color:var(--acc-500)}
.tab-btn .cnt{background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;padding:0 6px;margin-left:4px;vertical-align:1px}

.view{display:none;padding-top:20px}
.view.active{display:block}

/* ---------- การ์ด / ฟอร์ม ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.section-title{font-family:'Kanit',sans-serif;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;margin:0 0 14px;color:var(--brand-900);flex-wrap:wrap}
.section-title .sub{font-family:'Sarabun',sans-serif;font-weight:400;font-size:13px;color:var(--ink-soft)}
.section-title .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.section-title .num-badge{background:linear-gradient(135deg,var(--acc-500),var(--acc));color:#fff;font-size:12px;border-radius:6px;padding:2px 8px}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(4,1fr)}.grid-6{grid-template-columns:repeat(6,1fr)}
@media(max-width:820px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:1fr}}
.span-2{grid-column:span 2}.span-all{grid-column:1/-1}
@media(max-width:520px){.span-2{grid-column:auto}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.field label .req{color:var(--bad)}
.field input,.field select,.field textarea,.inp{font-family:'Sarabun',sans-serif;font-size:14.5px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--acc-500);box-shadow:0 0 0 3px rgba(11,143,99,.15)}
.field textarea{resize:vertical;min-height:60px}
.field input[type=checkbox],.field input[type=radio]{width:auto;padding:0;margin:0 6px 0 0;vertical-align:-2px;accent-color:var(--acc)}
.field label:has(input[type=checkbox]){display:flex;align-items:center;font-weight:500;color:var(--ink);padding-top:9px}
.hint{font-size:12px;color:#879390}
.pw-wrap{position:relative;display:flex}
.pw-wrap input{flex:1;padding-right:38px}
.pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;font-size:15px;color:var(--ink-soft);padding:4px 8px;line-height:1}

.btn{font-family:'Kanit',sans-serif;font-weight:600;font-size:14px;border-radius:10px;border:1px solid transparent;padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:filter .15s,background .15s;white-space:nowrap;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,var(--acc-500),var(--acc));color:#fff;box-shadow:0 4px 12px -2px rgba(11,143,99,.38)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-outline{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-outline:hover{background:var(--paper-2)}
.btn-ghost{background:transparent;border:none;color:var(--ink-soft)}
.btn-ghost:hover{color:var(--ink)}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn-danger:hover{filter:brightness(.97)}
.btn-sm{padding:4px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-header{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#e5eeea}
.btn-header:hover{background:rgba(255,255,255,.16)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
.toolbar .inp{width:auto}

/* ---------- ตาราง ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{background:var(--paper-2);color:var(--ink-soft);font-weight:600;font-size:12.5px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
table.data td{padding:8px 10px;border-bottom:1px solid var(--paper-2);vertical-align:top}
table.data tr:last-child td{border-bottom:none}
table.data tr.clickable{cursor:pointer}
table.data tr.clickable:hover td{background:#f6faf8}
table.data td.r,table.data th.r{text-align:right}
table.data td.c,table.data th.c{text-align:center}
table.data tfoot td{font-weight:700;background:#fafcfb;border-top:1px solid var(--line)}
.empty{padding:26px;text-align:center;color:var(--ink-mute)}

/* ---------- ป้ายสถานะ ---------- */
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:1px 9px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-info{background:var(--info-bg);color:var(--info)}.b-mute{background:var(--paper-2);color:var(--ink-soft)}
.chip{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);margin:0 4px 4px 0}
.chip.active{background:linear-gradient(135deg,var(--acc-500),var(--acc));color:#fff;border-color:transparent}

/* ---------- ภาพรวม ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .lb{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.kpi .big{font-family:'Kanit',sans-serif;font-weight:700;font-size:27px;line-height:1.15;color:var(--brand-900);font-variant-numeric:tabular-nums}
.kpi .big small{font-size:14px;font-weight:600;color:var(--ink-soft)}
.kpi .sm{font-size:12.5px;color:var(--ink-mute)}
.bar{height:8px;background:var(--paper-2);border-radius:99px;overflow:hidden;margin-top:8px;position:relative}
.bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--acc-500),var(--acc));border-radius:99px}
.bar > i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--brand-900)}
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;font-size:14px}
.alert .ic{flex:none;font-size:15px;line-height:1.4}
.alert.bad{background:var(--bad-bg);color:#7d2a1f}.alert.warn{background:var(--warn-bg);color:#6b4a05}.alert.info{background:var(--info-bg);color:#17497a}.alert.ok{background:var(--ok-bg);color:#215a39}
.alert .go{margin-left:auto;flex:none}
.chart-box svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* ---------- ชิ้นงาน ---------- */
.unit-grid td.st{text-align:center;cursor:pointer;min-width:62px;font-size:12px;user-select:none}
.unit-grid td.st.done{background:var(--acc-glow);color:var(--acc-deep);font-weight:600}
.unit-grid td.st:hover{outline:2px solid var(--acc-500);outline-offset:-2px}
.stage-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stage-sum .s{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.stage-sum .s b{font-family:'Kanit',sans-serif;font-size:19px;color:var(--brand-900)}

/* ---------- รูปถ่าย ---------- */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ph{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;position:relative;box-shadow:var(--shadow)}
.ph .img{aspect-ratio:4/3;background:var(--paper-2) center/cover no-repeat}
.ph .cap{padding:7px 9px;font-size:12.5px;line-height:1.4}
.ph .cap b{display:block;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .cap span{color:var(--ink-mute)}
.ph .sel{position:absolute;top:6px;left:6px;width:20px;height:20px;accent-color:var(--acc)}
.ph .flag{position:absolute;top:6px;right:6px}
.day-head{font-family:'Kanit',sans-serif;font-weight:600;color:var(--brand-900);margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.day-head .n{font-family:'Sarabun',sans-serif;font-weight:400;color:var(--ink-mute);font-size:13px}
.lightbox{position:fixed;inset:0;background:rgba(3,20,16,.92);z-index:9000;display:none;flex-direction:column}
.lightbox.show{display:flex}
.lightbox .lb-img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lightbox .lb-bar{background:#0b1f1a;color:#dfe9e5;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.lightbox .lb-bar .grow{flex:1}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);color:#fff;border:0;font-size:28px;width:46px;height:64px;border-radius:10px;cursor:pointer}
.lightbox .nav.prev{left:10px}.lightbox .nav.next{right:10px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink-soft);background:#fbfdfc;cursor:pointer}
.drop.over{border-color:var(--acc-500);background:var(--acc-glow)}
.upl-row{display:flex;gap:10px;align-items:center;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--paper-2)}
.upl-row img{width:54px;height:40px;object-fit:cover;border-radius:5px}

/* ---------- Checklist ---------- */
.ck-phase{font-family:'Kanit',sans-serif;font-weight:600;color:var(--brand-900);margin:14px 0 6px;font-size:15px}
.ck-item{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:#fff}
.ck-item.done{background:#f4faf7}
.ck-item.done .t{color:var(--ink-mute);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.ck-item input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--acc)}
.ck-item .meta{font-size:12px;color:var(--ink-mute)}
.guide h4{margin:12px 0 4px;color:var(--brand-900);font-size:14.5px}
.guide li{margin-bottom:4px;font-size:14px}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(3,32,26,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:760px;box-shadow:var(--shadow-lg);animation:pop .18s ease-out}
.modal.wide{max-width:1080px}
.modal.narrow{max-width:460px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:18px;color:var(--brand-900)}
.modal-close{margin-left:auto;background:transparent;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--ink-mute)}
.modal-body{padding:16px 20px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-foot .left{margin-right:auto}
.sub-h{font-family:'Kanit',sans-serif;font-weight:600;font-size:14.5px;color:var(--brand-900);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.rows-edit{display:flex;flex-direction:column;gap:6px}
.row-edit{display:grid;gap:6px;align-items:center}
.row-edit .x{background:transparent;border:0;color:var(--bad);font-size:18px;cursor:pointer;padding:2px 6px}

/* ---------- ทั่วไป ---------- */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--brand-900);color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;box-shadow:var(--shadow-lg);z-index:9500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.err{background:var(--bad)}
.page-loading-overlay{position:fixed;inset:0;background:var(--paper);z-index:100;display:flex;align-items:center;justify-content:center;transition:opacity .25s}
.page-loading-overlay.hide{opacity:0;pointer-events:none}
.page-loading-box{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--ink-soft);font-family:'Kanit',sans-serif;font-size:14px}
.page-loading-spin{width:26px;height:26px;border:3px solid var(--paper-2);border-top-color:var(--acc-500);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.muted{color:var(--ink-mute)}.small{font-size:12.5px}.nowrap{white-space:nowrap}.right{text-align:right}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.split{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.split > *{min-width:0}
@media(max-width:900px){.split{grid-template-columns:1fr}}
@media(max-width:820px){.rows-edit{overflow-x:auto;padding-bottom:4px}.rows-edit .row-edit{min-width:760px}.kv{grid-template-columns:105px 1fr}}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--ink-soft)}.kv dd{margin:0}
.welcome{max-width:640px;margin:40px auto;text-align:center}
.welcome h2{color:var(--brand-900)}

/* ---------- หน้าล็อกอิน (เหมือนระบบงานอุบัติเหตุ เปลี่ยนชื่อ/โทนสี) ---------- */
.auth-gate{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:18px;overflow:auto;background:radial-gradient(1100px 520px at 15% -10%, var(--brand-800) 0%, var(--ink-2) 60%)}
.auth-gate.show{display:flex}
.auth-card{background:#fff;border-radius:18px;padding:30px 28px 26px;width:100%;max-width:410px;box-shadow:var(--shadow-lg);text-align:center}
.auth-logo{width:72px;height:72px;margin:0 auto 6px;display:block}
.auth-card h2{margin:4px 0 2px;font-size:22px;color:var(--brand-900)}
.auth-sub{margin:0 0 18px;font-size:13px;color:var(--ink-mute)}
.auth-h3{margin:0 0 12px;font-size:16px;color:var(--ink);text-align:left}
.auth-card .field{text-align:left}
.auth-card .hint{text-align:left}
.auth-error{color:var(--bad);background:var(--bad-bg);padding:8px 10px;border-radius:8px;margin:0 0 12px}
.auth-btn{width:100%;justify-content:center}
.auth-demo{margin-top:14px;font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:7px 10px;text-align:left}
</style>
</head>
<body>
<div class="page-loading-overlay" id="pageLoadingOverlay">
  <div class="page-loading-box"><span class="page-loading-spin"></span><div>กำลังโหลดข้อมูล...</div></div>
</div>

<header class="app-header" id="appHeader" style="display:none">
  <div class="top-row">
    <div style="display:flex;align-items:center;gap:14px">
      <img src="logo.png" alt="ตรากรมทางหลวง" class="dept-logo">
      <div>
        <h1>ระบบควบคุมงานโครงการ <span class="demo-badge" id="demoBadge" style="display:none">โหมดทดลอง</span></h1>
        <p class="sub">หมวดทางหลวงเชิงเนิน · แขวงทางหลวงระยอง</p>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <p class="who" id="whoDisplay"></p>
      <button class="btn btn-sm btn-header" id="btnLogout">ออกจากระบบ</button>
    </div>
  </div>
  <div class="project-bar">
    <select id="projectSelect" aria-label="เลือกโครงการ"></select>
    <span id="projectStatus"></span>
